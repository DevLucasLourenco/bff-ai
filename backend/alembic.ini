[alembic]
script_location = %(here)s/alembic
# sqlalchemy.url NÃO fica aqui de propósito: era um caminho relativo ao cwd e
# migrava um banco diferente do que o app usa. env.py injeta a URL absoluta a
# partir de app.core.config, a mesma fonte que o app abre.

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
qualname =
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
